apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-prod-backend
  namespace: employee-prod
  labels:
    app: employee-management
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee-management
      environment: prod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: employee-management
        environment: prod
    spec:
      containers:
        - name: backend
          image: employee-management-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ems-prod-config
            - secretRef:
                name: ems-prod-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "300Mi"
            limits:
              cpu: "500m"
              memory: "600Mi"
