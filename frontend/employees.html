<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Employees</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="index.html">Sign Out</a>
    </nav>
  </header>
  <main class="hero">
    <section id="envBanner" class="banner"></section>
    <section class="card">
      <h2>Employee Management</h2>
      <div id="alert" class="alert" style="display:none"></div>
      <button id="showFormBtn" class="button">Add New Employee</button>
      <div class="table-wrapper" style="margin-top:20px;">
        <table id="employeeTable">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Salary</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section id="formCard" class="card" style="display:none;">
      <h3 id="formTitle">Add Employee</h3>
      <div class="form-group">
        <label>Name</label>
        <input id="employeeName" type="text" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="employeeEmail" type="email" />
      </div>
      <div class="form-group">
        <label>Department</label>
        <input id="employeeDepartment" type="text" />
      </div>
      <div class="form-group">
        <label>Designation</label>
        <input id="employeeDesignation" type="text" />
      </div>
      <div class="form-group">
        <label>Salary</label>
        <input id="employeeSalary" type="number" />
      </div>
      <button id="saveEmployeeBtn" class="button">Save</button>
      <button id="cancelBtn" class="button secondary" style="margin-left:12px;">Cancel</button>
    </section>
  </main>
  <footer class="footer">CRUD operations powered by Flask + JWT backend.</footer>
  <script src="js/employees.js"></script>
</body>
</html>
