<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Employee Management System</h1>
  </header>
  <main class="hero">
    <section class="card">
      <h2>Sign in to continue</h2>
      <p>Secure access for administrators and test users.</p>
      <div id="alert" class="alert" style="display:none"></div>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="admin" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>
      <button id="loginBtn" class="button">Login</button>
    </section>
  </main>
  <footer class="footer">Use <strong>admin</strong> / <strong>ChangeMe123!</strong> on development mode.</footer>
  <script src="js/auth.js"></script>
</body>
</html>
