name: EMS CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - qa
      - uat
      - main

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/ems-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/ems-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python code and run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p backend/instance
          python -m pytest backend/tests

      - name: Determine target environment
        id: env
        run: |
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF##*/}" == "develop" ]]; then echo "TARGET_ENV=dev" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF##*/}" == "qa" ]]; then echo "TARGET_ENV=qa" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF##*/}" == "uat" ]]; then echo "TARGET_ENV=uat" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then echo "TARGET_ENV=prod" >> $GITHUB_ENV; fi
          if [[ -z "$TARGET_ENV" ]]; then echo "Unsupported branch"; exit 1; fi
          echo "Selected environment: $TARGET_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.BACKEND_IMAGE }}:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.FRONTEND_IMAGE }}:latest

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4
        with:
          version: "1.30.0"
      - name: Dry-run manifest validation
        run: |
          kubectl apply --dry-run=client -f k8s/${{ env.TARGET_ENV }}

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl config view

      - name: Deploy application to Kubernetes
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          IMAGE_TAG: ${{ github.sha }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
        run: |
          kubectl apply -f k8s/${TARGET_ENV}/namespace.yaml
          kubectl apply -f k8s/${TARGET_ENV}/configmap.yaml
          kubectl apply -f k8s/${TARGET_ENV}/secret.yaml
          kubectl apply -f k8s/${TARGET_ENV}/deployment.yaml
          kubectl apply -f k8s/${TARGET_ENV}/service.yaml
          kubectl apply -f k8s/${TARGET_ENV}/frontend-deployment.yaml
          kubectl apply -f k8s/${TARGET_ENV}/frontend-service.yaml
          kubectl apply -f k8s/${TARGET_ENV}/ingress.yaml
          kubectl set image deployment/ems-${TARGET_ENV}-backend backend=${{ env.BACKEND_IMAGE }}:latest -n employee-${TARGET_ENV}
          kubectl set image deployment/ems-${TARGET_ENV}-frontend frontend=${{ env.FRONTEND_IMAGE }}:latest -n employee-${TARGET_ENV}
          kubectl rollout status deployment/ems-${TARGET_ENV}-backend -n employee-${TARGET_ENV} --timeout=120s
          kubectl rollout status deployment/ems-${TARGET_ENV}-frontend -n employee-${TARGET_ENV} --timeout=120s

      - name: Basic rollback on failed deployment
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          TARGET_ENV: ${{ env.TARGET_ENV }}
        run: |
          kubectl rollout undo deployment/ems-${TARGET_ENV}-backend -n employee-${TARGET_ENV} || true
